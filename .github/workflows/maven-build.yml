name: Java CI with Maven

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: self-hosted

    outputs:
      services: ${{ steps.changes.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          SERVICES=()

          for service in \
            spring-petclinic-admin-server \
            spring-petclinic-customers-service \
            spring-petclinic-vets-service \
            spring-petclinic-visits-service \
            spring-petclinic-api-gateway \
            spring-petclinic-discovery-server \
            spring-petclinic-config-server \
            spring-petclinic-genai-service
          do
            if git diff --name-only HEAD^ HEAD | grep -q "^${service}/"; then
              SERVICES+=("$service")
            fi
          done

          echo "Changed services:"
          printf '%s\n' "${SERVICES[@]}"

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build changed service
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: self-hosted

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Create version tag
        id: version
        run: |
          TAG="${GITHUB_SHA::7}"

          echo "VERSION_TAG=$TAG" >> "$GITHUB_ENV"

          echo "Service: ${{ matrix.service }}"
          echo "Version tag: $TAG"


      - name: Build service
        run: |
          echo "Building ${{ matrix.service }}"
          echo "Version: $VERSION_TAG"

          mvn -B package \
            --file "${{ matrix.service }}/pom.xml" \
            --settings ./settings.xml


      - name: Set Docker port
        run: |
          case "${{ matrix.service }}" in

            spring-petclinic-config-server)
              PORT=8888
              ;;

            spring-petclinic-discovery-server)
              PORT=8761
              ;;

            spring-petclinic-customers-service)
              PORT=8081
              ;;

            spring-petclinic-visits-service)
              PORT=8082
              ;;

            spring-petclinic-vets-service)
              PORT=8083
              ;;

            spring-petclinic-genai-service)
              PORT=8084
              ;;

            spring-petclinic-api-gateway)
              PORT=8080
              ;;

            spring-petclinic-admin-server)
              PORT=9090
              ;;

            *)
              echo "Unknown service: ${{ matrix.service }}"
              exit 1
              ;;

          esac

          echo "DOCKER_PORT=$PORT" >> "$GITHUB_ENV"

          echo "Service: ${{ matrix.service }}"
          echo "Docker port: $PORT"


      - name: Prepare Docker artifact
        run: |
          JAR=$(find "${{ matrix.service }}/target" -maxdepth 1 -name "*.jar" -type f | head -n 1)

          if [ -z "$JAR" ]; then
            echo "JAR file not found!"
            exit 1
          fi

          echo "Found JAR:"
          echo "$JAR"

          cp "$JAR" "${{ matrix.service }}.jar"

          echo "Docker artifact:"
          ls -lh "${{ matrix.service }}.jar"


      - name: Build Docker image
        run: |
          IMAGE="192.168.56.114/petclinic-microservice/${{ matrix.service }}:${VERSION_TAG}"

          echo "Building Docker image:"
          echo "$IMAGE"

          docker build \
            -f docker/Dockerfile \
            --build-arg ARTIFACT_NAME="${{ matrix.service }}" \
            --build-arg EXPOSED_PORT="${DOCKER_PORT}" \
            -t "$IMAGE" \
            .


      - name: Push Docker image
        run: |
          IMAGE="192.168.56.114/petclinic-microservice/${{ matrix.service }}:${VERSION_TAG}"

          echo "Pushing Docker image:"
          echo "$IMAGE"

          docker push "$IMAGE"


      - name: Cleanup Docker artifact
        if: always()
        run: |
          rm -f "${{ matrix.service }}.jar"

